apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agenticpool
  labels:
    app: gateway
spec:
  ports:
    - port: 7100
      targetPort: 7100
      name: http
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agenticpool
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: agora-gateway
          image: localhost:5000/agora:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7100
              name: http
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: AGORA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 7100
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 7100
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
