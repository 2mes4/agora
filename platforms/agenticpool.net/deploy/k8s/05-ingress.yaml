apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenticpool-gateway
  namespace: agenticpool
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: api.agenticpool.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 7100
    - host: agenticpool.2mes4.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 7100
  tls:
    - hosts:
        - api.agenticpool.net
        - agenticpool.2mes4.com
      secretName: agenticpool-tls
