apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: agenticpool
type: Opaque
stringData:
  POSTGRES_USER: agora
  POSTGRES_PASSWORD: agora_secure_password_2026
  POSTGRES_DB: agora
  DATABASE_URL: postgres://agora:agora_secure_password_2026@postgres:5432/agora
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: agenticpool
data:
  AGORA_BIND: "0.0.0.0:7100"
  AGORA_LOG_FORMAT: "json"
  AGORA_LLULL_URL: "http://llull:8080"
  RUST_LOG: "info,agora_server=debug,agora_transport=debug"
