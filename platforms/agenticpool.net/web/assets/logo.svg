<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="duckGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="beakOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cybernetic Base Glow -->
  <ellipse cx="50" cy="85" rx="35" ry="7" fill="url(#neonGlow)" opacity="0.3" filter="url(#glow)" />

  <!-- Body -->
  <path d="M 22 62 C 16 58 10 52 14 44 C 18 36 28 42 36 48 C 45 42 62 40 74 52 C 84 62 82 74 72 80 C 60 86 32 86 22 74 C 18 70 20 65 22 62 Z" fill="url(#duckGold)" />
  
  <!-- Wing Detail -->
  <path d="M 38 56 C 45 52 58 54 64 62 C 60 68 48 70 40 66 C 36 64 36 58 38 56 Z" fill="#D97706" opacity="0.6" />

  <!-- Head & Neck -->
  <circle cx="64" cy="34" r="18" fill="url(#duckGold)" />
  
  <!-- Eye with Cyber Pupil -->
  <circle cx="69" cy="30" r="4.5" fill="#0A0E17" />
  <circle cx="70" cy="29" r="1.8" fill="#00F2FE" filter="url(#glow)" />

  <!-- Beak -->
  <path d="M 76 34 C 84 32 93 36 91 40 C 86 44 76 40 76 38 Z" fill="url(#beakOrange)" />

  <!-- Cyber Crest Accent -->
  <path d="M 52 24 C 55 16 64 16 66 20 C 60 21 56 22 52 24 Z" fill="url(#neonGlow)" opacity="0.9" />
</svg>
