# Example gateway configuration

# Consumed by `agora-server` via `--config config/server.example.toml`.
# Every field is optional; CLI flags override file values.

bind = "0.0.0.0:7100"

# Host the built-in demo echo agent (card at /a2a/echo/.well-known/agent-card.json)
demo_agent = true

# Public base URL advertised in hosted agents' cards.
# Defaults to http://<bind-host>:<bind-port> when unset.
# advertise = "https://agora.example.com"

# PostgreSQL connection URL for the persistence backend. When unset, all
# storage is in-memory. Tables are created automatically on connect.
# database_url = "postgres://agora:agora@localhost:5432/agora"

# Log output format: "text" or "json"
log_format = "json"
